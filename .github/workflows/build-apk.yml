name: Build Begroting APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name begroting

      - name: Create distinct Begroting launcher icon
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          root = Path("android/app/src/main/res")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          green = (23,63,53,255)
          gold = (231,197,116,255)
          cream = (250,247,235,255)
          for folder,size in sizes.items():
              d = root / folder
              d.mkdir(parents=True, exist_ok=True)
              im = Image.new("RGBA",(size,size),green)
              draw = ImageDraw.Draw(im)
              margin = max(2, size//16)
              draw.rounded_rectangle((margin,margin,size-margin-1,size-margin-1), radius=max(5,size//5), outline=gold, width=max(1,size//24))
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf", int(size*.57))
              except OSError:
                  font = ImageFont.load_default()
              box = draw.textbbox((0,0),"B",font=font,stroke_width=0)
              x = (size-(box[2]-box[0]))/2 - box[0]
              y = size*.13 - box[1]
              draw.text((x,y),"B",font=font,fill=cream)
              base = int(size*.79)
              bar_w = max(2,size//12)
              for i,h in enumerate((.10,.17,.25)):
                  bx = int(size*.34)+i*(bar_w+max(1,size//30))
                  draw.rounded_rectangle((bx,int(base-size*h),bx+bar_w,base),radius=max(1,size//50),fill=gold)
              for name in ("ic_launcher.png","ic_launcher_round.png"):
                  im.save(d/name)
          fg = Image.new("RGBA",(432,432),(0,0,0,0))
          draw = ImageDraw.Draw(fg)
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf",250)
          except OSError:
              font = ImageFont.load_default()
          box = draw.textbbox((0,0),"B",font=font,stroke_width=0)
          x = (432-(box[2]-box[0]))/2-box[0]
          y = 55-box[1]
          draw.text((x,y),"B",font=font,fill=cream)
          for i,h in enumerate((42,70,102)):
              bx = 142+i*48
              draw.rounded_rectangle((bx,350-h,bx+28,350),radius=6,fill=gold)
          for folder,size in sizes.items():
              fg.resize((size*3,size*3),Image.Resampling.LANCZOS).save(root/folder/"ic_launcher_foreground.png")
          colors = root/"values"/"colors.xml"
          colors.parent.mkdir(parents=True,exist_ok=True)
          colors.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#173F35</color>\n</resources>\n''')
          print("Created custom green-and-gold Begroting icon assets")
          PY

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          found = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              updated, count = re.subn(r'(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|[0-9]+)', r'\g<1>36', text)
              if count:
                  path.write_text(updated)
                  found = True
                  print(f"Updated {path} to compile SDK 36")
          if not found:
              raise SystemExit("Could not find compileSdk setting in generated Android Gradle files")
          PY

      - name: Configure permanent Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/begroting-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure stable Android application identity and release signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit("Android app Gradle file was not generated")
          text = path.read_text()
          expected_id = "com.example.begroting"
          pattern = r"(?m)^(\s*applicationId\s*(?:=\s*)?)['\"]([^'\"]+)['\"]"
          text, count = re.subn(pattern, lambda m: m.group(1) + '"' + expected_id + '"', text, count=1)
          if count != 1:
              raise SystemExit("Could not locate exactly one applicationId")
          if path.suffix == ".kts":
              signing = '''
          signingConfigs {
              create("release") {
                  keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH")!!)
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
              }
          }
          '''
              if 'create("release")' not in text:
                  text = text.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
              text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              if 'signingConfig = signingConfigs.getByName("release")' not in text:
                  text = re.sub(r'(release\s*\\{)', r'\1\n            signingConfig = signingConfigs.getByName("release")', text, count=1)
          else:
              signing = '''
          signingConfigs {
              release {
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
              }
          }
          '''
              if "signingConfigs {" not in text:
                  text = text.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
              text = text.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              if "signingConfig signingConfigs.release" not in text:
                  text = re.sub(r'(release\s*\\{)', r'\1\n            signingConfig signingConfigs.release', text, count=1)
          path.write_text(text)
          print(f"Configured {path} with stable ID {expected_id} and permanent release signing")
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify APK package, version, and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.example.begroting'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "versionCode='$GITHUB_RUN_NUMBER'" "$RUNNER_TEMP/apk-badging.txt"
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | openssl x509 -noout -fingerprint -sha256 > "$RUNNER_TEMP/keystore-fingerprint.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          temp = Path(os.environ["RUNNER_TEMP"])
          apk = (temp / "apk-signature.txt").read_text()
          cert = (temp / "keystore-fingerprint.txt").read_text()
          def normalize(value):
              return re.sub(r"[^0-9A-F]", "", value.upper())
          a = re.search(r"(?:Signer #1|V[0-9]+ Signer): certificate SHA-256 digest:\s*([0-9a-fA-F:]+)", apk, re.IGNORECASE)
          b = re.search(r"SHA256 Fingerprint\s*=\s*([0-9a-fA-F:]+)", cert, re.IGNORECASE)
          if not a or not b:
              print("APK signer fingerprint line found:", bool(a))
              print("Keystore fingerprint line found:", bool(b))
              print("Keystore fingerprint output:", cert.strip())
              raise SystemExit("Could not extract APK and keystore certificate fingerprints")
          apk_fp, key_fp = normalize(a.group(1)), normalize(b.group(1))
          print(f"APK certificate SHA-256: {apk_fp}")
          print(f"Keystore certificate SHA-256: {key_fp}")
          if len(apk_fp) != 64 or len(key_fp) != 64:
              raise SystemExit("Extracted SHA-256 fingerprint has an unexpected length")
          if apk_fp != key_fp:
              raise SystemExit("APK certificate does not match permanent upload keystore")
          print("APK identity, build number, and signing certificate verified")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: begroting-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
